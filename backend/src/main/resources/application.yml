spring:
  application:
    name: roastbench-api
  # Database settings come from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see docker-compose.yml and docs/deployment.md).
  datasource:
    url: jdbc:postgresql://localhost:5432/roastbench
    username: roastbench
    password: roastbench
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # The website (on another address) may read the health check. /api has its own CORS setting in WebConfig.
      cors:
        allowed-origins: ${roastbench.cors-allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

roastbench:
  # Comma separated list of browser origins allowed to call the API (the GitHub Pages site in production).
  cors-allowed-origins: http://localhost:5173
  # Token for POST /api/admin/demo/reset. Empty disables the endpoint.
  admin-token: ${ADMIN_TOKEN:}
  limits:
    max-roasts: 500
    max-lots: 200
  demo:
    # Fill an empty database with synthetic demo data at startup.
    seed-on-startup: ${SEED_DEMO_DATA:false}
