name: Deploy web app to GitHub Pages

# The static web app lives on GitHub Pages (always fast, always on); the API runs on a free host that wakes on demand.
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables) to the API's base URL.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /roastbench/
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # GitHub Pages serves 404.html for unknown paths: a copy of index.html lets deep links such as /roastbench/roasts/12 work.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
