name: Reset demo data

# Optional. Puts the example data back every night, so the public demo always looks clean.
# It needs the repository variable API_URL and the secret DEMO_ADMIN_TOKEN. Without them it does nothing.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset the demo data
        env:
          API_URL: ${{ vars.API_URL }}
          TOKEN: ${{ secrets.DEMO_ADMIN_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then echo "API_URL or DEMO_ADMIN_TOKEN is not set, nothing to do"; exit 0; fi
          curl --fail --silent --show-error --max-time 180 --retry 3 --retry-delay 20 \
            -X POST -H "X-Admin-Token: $TOKEN" "$API_URL/api/admin/demo/reset"
