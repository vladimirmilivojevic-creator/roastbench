name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, then integration tests against a real PostgreSQL 16 started by Testcontainers.
      # (Locally the same tests run against embedded PostgreSQL binaries, which needs no Docker.)
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B -ntp verify -Droastbench.test.db=testcontainers
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore
