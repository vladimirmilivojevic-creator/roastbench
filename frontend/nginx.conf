server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 6m;

    # The API container (see docker-compose.yml).
    # Host must keep its port ($http_host): browsers send an Origin header on POST/PUT/PATCH, and Spring only treats the
    # request as same-origin (not a CORS request) when Origin matches the Host it sees.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator/health {
        proxy_pass http://api:8080;
    }
    location /v3/ {
        proxy_pass http://api:8080;
    }
    location /swagger-ui {
        proxy_pass http://api:8080;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths (deep links such as /roasts/12) get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
