# Run the whole app with one command:   docker compose up
# Then open http://localhost:8080  (API docs: http://localhost:8080/swagger-ui.html)
#
# The first start builds both images (a few minutes) and fills the database with synthetic demo data.
# Stop with Ctrl+C; `docker compose down -v` also deletes the database volume.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roastbench
      POSTGRES_USER: roastbench
      POSTGRES_PASSWORD: roastbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastbench -d roastbench"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/roastbench
      SPRING_DATASOURCE_USERNAME: roastbench
      SPRING_DATASOURCE_PASSWORD: roastbench
      SEED_DEMO_DATA: "true"
      # The browser calls the API through the web container, so its origin is the web app's address.
      ROASTBENCH_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
